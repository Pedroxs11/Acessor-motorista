name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable

      - name: Generate missing Flutter Android scaffolding
        run: |
          if [ ! -f android/settings.gradle ] || [ ! -f android/app/build.gradle ]; then
            flutter create --platforms=android /tmp/flutter_android_scaffold
            cp -Rn /tmp/flutter_android_scaffold/android/. android/
            find android/app -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) -exec sed -i 's/com\.example\.flutter_android_scaffold/com\.acessor\.motorista/g' {} +
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: acessor-motorista-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
